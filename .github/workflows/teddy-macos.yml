name: teddy for macOS

on:
  push:
    paths: ["teddy-macos/**", ".github/workflows/teddy-macos.yml"]
  pull_request:
    paths: ["teddy-macos/**", ".github/workflows/teddy-macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the release zip is cross-compiled on Linux, build it the same way here
  build-on-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: teddy-macos/build.sh osx-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: teddy-macos-arm64-built-on-linux
          path: teddy-macos/dist/teddy-1.7.0-macos-arm64.zip

  test-on-apple-silicon:
    needs: build-on-linux
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - run: sw_vers && uname -m && sysctl -n machdep.cpu.brand_string
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test tools
        run: |
          brew install sox lame opus-tools
          python -m pip install numpy

      - name: Build natively on macOS
        run: teddy-macos/build.sh osx-arm64
      - name: Test the native build
        run: |
          unzip -q teddy-macos/dist/teddy-1.7.0-macos-arm64.zip -d native
          teddy-macos/tests/e2e.sh native/teddy-1.7.0-macos-arm64/teddy

      - uses: actions/download-artifact@v8
        with:
          name: teddy-macos-arm64-built-on-linux
          path: from-linux
      - name: Test the zip built on Linux
        run: |
          unzip -q from-linux/teddy-1.7.0-macos-arm64.zip -d from-linux
          codesign --verify --strict --verbose=2 from-linux/teddy-1.7.0-macos-arm64/teddy
          codesign --display --verbose=2 from-linux/teddy-1.7.0-macos-arm64/teddy
          teddy-macos/tests/e2e.sh from-linux/teddy-1.7.0-macos-arm64/teddy

      - uses: actions/upload-artifact@v7
        with:
          name: teddy-1.7.0-macos-arm64
          path: teddy-macos/dist/teddy-1.7.0-macos-arm64.zip
